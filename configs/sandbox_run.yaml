# This is the EXACT config used to produce the results reported in README.md
# section 7 and the before/after images in outputs/. Kept for reproducibility.
# It is a reduced-scale demo config for this project's compute-constrained
# development sandbox (1 CPU core, no GPU) — use configs/config.yaml for the
# real submission training run.

data:
  train_noisy_dir: data/train/NoisyLR
  train_gt_dir: data/train/GT
  test_noisy_dir: data/test/NoisyLR
  val_split: 0.1
  scale: 2
  patch_size: 32
  max_train_pairs: 640   # sandbox-only cap; remove/increase for the real run
  max_val_pairs: 80      # sandbox-only cap; remove/increase for the real run

model:
  in_channels: 1
  out_channels: 1
  channels: 24
  growth: 12
  num_blocks: 4
  scale: 2

loss:
  w_charbonnier: 1.0
  w_ssim: 0.2
  w_edge: 0.1
  w_perceptual: 0.0
  use_perceptual: false   # needs internet for VGG weights; enable when available

train:
  batch_size: 16
  num_epochs: 15
  lr: 2.0e-4
  weight_decay: 0.0
  seed: 42
  amp: false               # CPU-only sandbox; enable on GPU
  resynth_prob: 0.3
  checkpoint_dir: weights
  log_every: 10
  val_every: 1
  num_workers: 0
  resume_from: weights/model_last.pt

inference:
  batch_size: 16
